name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # macos-14 已被 GitHub 下线（2026），用 latest 自动跟随当前稳定版
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: Xcode 云端构建（真机 SDK，免签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project SimpleChat.xcodeproj \
            -scheme SimpleChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            2>&1 | tee build_full.log | tail -40
          echo "构建成功"

      - name: 失败时打印全部编译错误
        if: failure()
        run: |
          echo "===== 全部 error 行 ====="
          grep -E "error:|fatal error:|BUILD FAILED|The following build commands failed" build_full.log || echo "（无 error 行，请下载完整日志查看）"
          echo "===== error 行前后上下文 ====="
          grep -B 3 -A 8 -E "error:|fatal error:" build_full.log || true

      - name: 打包 IPA（Payload 目录 + zip）
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SimpleChat.app Payload/
          zip -r SimpleChat-unsigned.ipa Payload
          ls -lh SimpleChat-unsigned.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SimpleChat-unsigned-ipa
          path: SimpleChat-unsigned.ipa
          retention-days: 30

      - name: 上传完整构建日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log
          retention-days: 30
